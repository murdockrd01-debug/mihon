name: Build Fork APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (no telemetry, no updater)
        run: ./gradlew assembleRelease -Pdist=foss -Pinclude-telemetry=false -Penable-updater=false

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-fork-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
